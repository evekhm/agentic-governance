static_resources:
  listeners:
    - name: lesson2_egress_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 10001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: lesson2_egress
                route_config:
                  name: egress_routes
                  virtual_hosts:
                    - name: allowed_mcp
                      domains: ["orders-read-mcp.internal", "orders-read-mcp.internal:10001"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: echo_service }
                    - name: deny_all_unregistered
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 403
                            body:
                              inline_string: "Blocked by L6 default-deny egress allowlist\n"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: echo_service
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: echo_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: echo-upstream, port_value: 8080 }
