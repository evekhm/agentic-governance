# Track A Ingress Envoy (L1 + L2): JWT authn, rate limit, ext_authz, ext_proc screening
static_resources:
  listeners:
    - name: ingress_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: agent_app
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: adk_agent_local }
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak_in:
                          issuer: "${KEYCLOAK_ISSUER}"
                          audiences: ["web-app"]
                          forward: true
                          remote_jwks:
                            http_uri:
                              uri: "${KEYCLOAK_JWKS_URI}"
                              cluster: keycloak_jwks
                              timeout: 2s
                      rules:
                        - match: { prefix: "/" }
                          requires: { provider_name: keycloak_in }
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      failure_mode_allow: false
                      grpc_service:
                        envoy_grpc: { cluster_name: ext_proc_local }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: adk_agent_local
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: adk_agent_local
        endpoints:
          - lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 8081 } } } }]
    - name: ext_proc_local
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: ext_proc_local
        endpoints:
          - lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 8082 } } } }]
