# Optional DPoP / cnf.jkt verifier Envoy sidecar in front of MCP Toolbox (Track A)
static_resources:
  listeners:
    - name: mcp_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp_ingress
                route_config:
                  name: local_mcp
                  virtual_hosts:
                    - name: mcp_toolbox
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: mcp_toolbox_local }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: mcp_toolbox_local
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: mcp_toolbox_local
        endpoints:
          - lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 5000 } } } }]
