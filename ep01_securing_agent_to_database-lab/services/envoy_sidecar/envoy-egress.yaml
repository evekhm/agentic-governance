# Track A Egress Envoy (L5 + L6): Default-deny allowlist + ext_proc token exchange
static_resources:
  listeners:
    - name: egress_listener
      address:
        socket_address: { address: 127.0.0.1, port_value: 15001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_http
                route_config:
                  name: egress_routes
                  virtual_hosts:
                    - name: mcp_read
                      domains: ["orders-read-mcp.internal"]
                      routes:
                        - match: { prefix: "/mcp" }
                          route: { cluster: orders_read_mcp }
                    - name: mcp_write
                      domains: ["orders-write-mcp.internal"]
                      routes:
                        - match: { prefix: "/mcp" }
                          route: { cluster: orders_write_mcp }
                    - name: deny_all_unregistered
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response: { status: 403, body: { inline_string: "Blocked by L6 default-deny egress allowlist" } }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      failure_mode_allow: false
                      grpc_service:
                        envoy_grpc: { cluster_name: ext_proc_local }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
