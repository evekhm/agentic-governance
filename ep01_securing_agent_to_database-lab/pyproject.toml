[project]
name = "ep01-securing-agent-to-database-lab"
version = "0.1.0"
description = "Reference lab for Episode 01: Securing the Agent-to-Database Connection"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.11.0",
    "google-cloud-aiplatform>=2.1.0",
    "google-cloud-modelarmor>=0.2.0",
    "google-cloud-dlp>=3.25.0",
    "google-cloud-bigquery>=3.25.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "pyjwt[crypto]>=2.10.0",
    "grpcio>=1.70.0",
    "xds-protos>=1.70.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "jsonschema>=4.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
